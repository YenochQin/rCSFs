name: Publish packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact package version to publish (1.3.2)"
        required: true
        type: string
      publish_pypi:
        description: "Upload validated packages to PyPI"
        required: true
        default: false
        type: boolean
      github_release:
        description: "Create a GitHub Release with the same validated packages"
        required: true
        default: false
        type: boolean
      draft:
        description: "Keep the GitHub Release as a draft (turn off to publish it)"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: package-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - name: Check branch and requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          import tomllib

          if os.environ["GITHUB_REF"] != "refs/heads/main":
              raise SystemExit("Run this workflow from main.")
          expected = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
          if os.environ["RELEASE_VERSION"] != expected:
              raise SystemExit(f"Requested version must match the source version: {expected}")
          print(f"Preparing rcsfs {expected} from {os.environ['GITHUB_SHA']}")
          PYTHON
      - name: Check GitHub Release publishing behavior offline
        run: python -B tests/test_github_release.py

  build:
    needs: preflight
    uses: ./.github/workflows/build-release.yml

  prepare:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - uses: actions/download-artifact@v7
        with:
          pattern: rcsfs-*
          path: artifacts
          merge-multiple: false
      - name: Install validation tools
        run: python -m pip install 'twine>=6.2'
      - name: Assemble and validate the complete release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python scripts/prepare_publish.py --artifacts artifacts --outdir dist --version "$RELEASE_VERSION"
          python -m twine check --strict dist/*.whl dist/*.tar.gz
          python scripts/check_release.py dist
      - uses: actions/upload-artifact@v6
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error

  publish_pypi:
    needs: prepare
    if: ${{ inputs.publish_pypi && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/project/rcsfs/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: pypi-distributions
          path: dist
      - name: Upload the validated distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github_release:
    needs: prepare
    if: ${{ inputs.github_release && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - name: Create a GitHub Release from this run's validated packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_DRAFT: ${{ inputs.draft }}
        run: python -B scripts/github_release.py --version "$RELEASE_VERSION" --draft "$RELEASE_DRAFT"
