name: Native Rust CLI

on:
  workflow_dispatch:
  pull_request:
    paths: ['src/**', 'tests/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/native-cli.yml']
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/native-cli.yml']

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Build without Python
        run: cargo build --release --locked --no-default-features --features cli --bin rcsfs
      - name: Exercise the executable without Python on PATH
        run: cargo test --release --locked --no-default-features --features cli --test native_cli_test
      - uses: actions/upload-artifact@v6
        with:
          name: rcsfs-native-${{ matrix.os }}
          path: |
            target/release/rcsfs
            target/release/rcsfs.exe
            LICENSE
            licenses/*.txt
          if-no-files-found: error
