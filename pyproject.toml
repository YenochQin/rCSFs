[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "rcsfs"
description = "Rust-powered Python library for converting atomic-physics CSF data to Parquet and generating ML-ready descriptors"
requires-python = ">=3.14"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "licenses/*.txt"]
keywords = ["GRASP", "atomic physics", "CSF", "Parquet", "Rust"]
authors = [
    {name = "Yi (Yenoch) Qin", email = "yenochqin@hotmail.com"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Intended Audience :: Science/Research",
    "Environment :: Console",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = ["version"]
dependencies = [
    "polars>=1.36.1",
]

[project.scripts]
rcsfs = "rcsfs.cli:main"

[project.urls]
Homepage = "https://github.com/YenochQin/rCSFs"
Source = "https://github.com/YenochQin/rCSFs"
Issues = "https://github.com/YenochQin/rCSFs/issues"

[dependency-groups]
dev = [
    "maturin>=1.14,<2.0",
    "pytest>=9.0.2",
    "pytest-pretty>=1.2.0",
    "pytest-speed>=0.3.5",
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "ipython>=9.8.0",
    "ipykernel>=7.1.0",
    "notebook>=7.0.0",
]
lint = [
    "basedpyright>=1.39.9",
    "ruff>=0.8.2",
]

[tool.maturin]
python-source = "."
module-name = "rcsfs._rcsfs"
features = ["pyo3/extension-module", "pyo3/generate-import-lib"]
strip = true
# The source archive is a buildable release, not the development workspace.
include = [
    { path = "docs/releasing.md", format = "sdist" },
    { path = "scripts/check_release.py", format = "sdist" },
    { path = "tests/fixtures/sample.csf", format = "sdist" },
]
exclude = ["**/__pycache__/**", "**/*.pyc"]

[tool.uv]
# Local wheel consumers must rebuild when Python or Rust sources change,
# even when the package version and pyproject.toml remain unchanged.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "build.rs" },
    { file = "src/**/*.rs" },
    { file = "rcsfs/**/*.py" },
    { file = "rcsfs/**/*.pyi" },
    { file = "rcsfs/py.typed" },
    { file = "README.md" },
    { file = "LICENSE" },
    { file = "licenses/*.txt" },
]

[tool.basedpyright]
include = ["rcsfs"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

# reportMissingImports = "error"
# reportMissingTypeStubs = false
reportAny = "error"
reportInvalidCast = "error"
reportUninitializedInstanceVariable = "error"
reportUnusedCallResult = "error"
reportUnreachable = "error"

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=temp"
# `[tool.maturin] python-source = "."` makes this repository the package root,
# so the checkout's `rcsfs/` must win over the wheel `uv sync` installed in the
# shared environment. Without this, the bare `pytest` script resolves `rcsfs`
# from site-packages and the suite silently tests whatever revision was last
# synced instead of the working tree.
pythonpath = ["."]
