# Registered CSF-generation benchmark transcripts.
#
# Every entry is a complete, self-contained `rcsfgenerate` transcript: it needs
# no GRASP checkout, no executable and no private dataset, so the registered
# baselines can be reproduced from this repository alone.
#
# `sha256` covers the transcript bytes exactly. A drifted fixture is rejected
# before a new measurement is compared with a recorded baseline, because a
# changed input makes the comparison meaningless. The expected counts are the
# values registered in docs/benchmarks; the maintained test suite checks the
# hash and `unique_occupations` (cheap), while `scripts/benchmark_v2_generation.py`
# additionally cross-checks `records` against a real run (expensive).

version = 1

