name: Publish packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact package version to publish (3.0.1)"
        required: true
        type: string
      publish_pypi:
        description: "Upload validated packages to PyPI"
        required: true
        default: false
        type: boolean
      github_release:
        description: "Create a GitHub Release with the same validated packages"
        required: true
        default: false
        type: boolean
      draft:
        description: "Keep the GitHub Release as a draft (turn off to publish it)"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: package-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - name: Check branch and requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          import tomllib

          if os.environ["GITHUB_REF"] != "refs/heads/main":
              raise SystemExit("Run this workflow from main.")
          expected = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
          if os.environ["RELEASE_VERSION"] != expected:
              raise SystemExit(f"Requested version must match the source version: {expected}")
          print(f"Preparing rcsfs {expected} from {os.environ['GITHUB_SHA']}")
          PYTHON
      - name: Check GitHub Release publishing behavior offline
        run: python -B tests/test_github_release.py

  build:
    # Keep the job-name prefix consumed by scripts/github_release.py.
    name: build / build (${{ matrix.target }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            interpreter: python3.15
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            interpreter: python
          - os: macos-15
            target: aarch64-apple-darwin
            interpreter: python
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: "2"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - name: Build extension wheel and source archive
        uses: PyO3/maturin-action@v1
        with:
          command: build
          maturin-version: v1.15.0
          rust-toolchain: stable
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --release --locked --sdist --interpreter ${{ matrix.interpreter }} --out dist
      - name: Build and audit Python-free CLI from source archive
        uses: PyO3/maturin-action@v1
        with:
          command: build
          maturin-version: v1.15.0
          rust-toolchain: stable
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --release --locked --sdist --bindings bin --no-default-features --features cli --auditwheel check --interpreter ${{ matrix.interpreter }} --out native-dist
      - name: Combine audited wheels
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          from build_backend import merge_wheels
          library, = Path("dist").glob("*.whl")
          native, = Path("native-dist").glob("*.whl")
          print(merge_wheels(library, native, Path("dist")))
          PYTHON
      - name: Install wheel and validation tools
        run: |
          python -m pip install 'twine>=6.2' uv
          python -m pip install --only-binary=:all: dist/*.whl
      - name: Check archives and exercise extracted wheel
        run: |
          python -m twine check --strict dist/*
          python scripts/check_release.py dist --smoke
          rcsfs --version
          uv run --no-project --no-sync rcsfs --version
      - uses: actions/upload-artifact@v6
        with:
          name: rcsfs-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  prepare:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - uses: actions/download-artifact@v7
        with:
          pattern: rcsfs-*
          path: artifacts
          merge-multiple: false
      - name: Install validation tools
        run: python -m pip install 'twine>=6.2'
      - name: Assemble and validate the complete release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python scripts/prepare_publish.py --artifacts artifacts --outdir dist --version "$RELEASE_VERSION"
          python -m twine check --strict dist/*.whl dist/*.tar.gz
          python scripts/check_release.py dist
      - uses: actions/upload-artifact@v6
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error

  publish_pypi:
    needs: prepare
    if: ${{ inputs.publish_pypi && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/rcsfs/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: pypi-distributions
          path: dist
      - name: Upload the validated distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github_release:
    needs: prepare
    if: ${{ inputs.github_release && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - name: Create a GitHub Release from this run's validated packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_DRAFT: ${{ inputs.draft }}
        run: python -B scripts/github_release.py --version "$RELEASE_VERSION" --draft "$RELEASE_DRAFT"
