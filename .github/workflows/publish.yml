name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact package version to publish (1.3.1)"
        required: true
        type: string
      publish:
        description: "Upload to PyPI after all checks pass (leave off for a dry run)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pypi-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Check branch and requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          import tomllib

          if os.environ["GITHUB_REF"] != "refs/heads/main":
              raise SystemExit("Run this workflow from main.")
          expected = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
          if os.environ["RELEASE_VERSION"] != expected:
              raise SystemExit(f"Requested version must match the source version: {expected}")
          print(f"Preparing rcsfs {expected} from {os.environ['GITHUB_SHA']}")
          PYTHON

  build:
    needs: preflight
    uses: ./.github/workflows/build-release.yml

  prepare:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          pattern: rcsfs-*
          path: artifacts
          merge-multiple: false
      - name: Install validation tools
        run: python -m pip install 'twine>=6.2'
      - name: Assemble and validate the complete release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python scripts/prepare_publish.py --artifacts artifacts --outdir dist --version "$RELEASE_VERSION"
          python -m twine check --strict dist/*.whl dist/*.tar.gz
          python scripts/check_release.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: prepare
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/project/rcsfs/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist
      - name: Upload the validated distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
