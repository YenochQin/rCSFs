[package]
name = "rCSFs"

version = "3.0.0"

edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/YenochQin/rCSFs"
description = "Rust-powered Python library for converting atomic-physics CSF data to Parquet and generating ML-ready descriptors"
# Keep local reports, datasets, old wheels and agent files out of source releases.
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/build.rs",
    "/pyproject.toml",
    "/LICENSE",
    "/licenses/*.txt",
    "/README.md",
    "/README.zh-CN.md",
    "/src/**/*.rs",
    "/rcsfs/*.py",
    "/rcsfs/*.pyi",
    "/rcsfs/py.typed",
]

[features]
default = ["python"]
python = ["dep:pyo3", "dep:pyo3-arrow"]
cli = ["dep:clap", "dep:serde_json", "dep:tempfile", "toml/preserve_order"]

[dependencies]
arrow = "59.0.0"
arrow-ipc = { version = "59.0.0", features = ["lz4", "zstd"] }
parquet = "59.0.0"
pyo3 = { version = "0.30.1", optional = true }
pyo3-arrow = { version = "0.20.0", optional = true, default-features = false }
toml = "0.9.8"
serde = { version = "1.0.215", features = ["derive"] }
crossbeam-channel = "0.5.13"
num_cpus = "1.16.0"
anyhow = "1.0.100"
libc = "0.2"
rayon = "1.10"
sha2 = "0.10"
clap = { version = "4.5", optional = true }
serde_json = { version = "1.0", optional = true }
tempfile = { version = "3", optional = true }

[[bin]]
name = "rcsfs"
path = "src/bin/rcsfs.rs"
required-features = ["cli"]

[lib]
name = "_rcsfs"
crate-type = ["cdylib", "rlib", "staticlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
